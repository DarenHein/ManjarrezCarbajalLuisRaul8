<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <script src="index.js"></script>
    <style>
        body{
            background-color: #4bd613; /* Color de fondo gris claro */
        }
        #Centro{
            background-color: purple;
            position: absolute;
            top: 30%;
            left: 40%;
            width: 300px;
            height: 300px;
            box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.2);
            color: white; /* Color del texto dentro del contenedor */
            text-align: center;
            font-size: 20px;
            border-radius: 10%;
        }

        #numero{
            text-align: center;
            font-size: 70px;
        }
    </style>
</head>
<body>
    <div id="Centro">
        <p><u><strong>Contador</strong></u></p>
        <p id="numero">!</p>
    </div>
</body>
</html>
